name: daily-job-alert

on:
  schedule:
    # UTC 기준. 한국시간(KST) 08:00 = UTC 23:00 (전날).
    - cron: "0 23 * * *"
  workflow_dispatch:   # 수동 실행 버튼

permissions:
  contents: write      # seen.json 커밋을 위해 필요

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          WORK24_AUTH_KEY: ${{ secrets.WORK24_AUTH_KEY }}
          SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
          WANTED_API_KEY: ${{ secrets.WANTED_API_KEY }}
          EXPERIENCED_ONLY: "0"
        run: python main.py

      - name: Commit seen.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/seen.json
          git diff --staged --quiet || git commit -m "chore: update seen.json [skip ci]"
          git push
